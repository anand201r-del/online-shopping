{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center auth-wrap">

    <div class="card shadow-lg p-4 auth-card">

        <!-- TITLE -->
        <div class="brand justify-content-center mb-2"><span class="brand-mark"><i class="fa-solid fa-bag-shopping"></i></span> ShopEase</div>
        <h3 class="text-center mb-1">Welcome back</h3>
        <p class="text-center text-muted mb-4">Log in to continue</p>

        <!-- ERROR MESSAGE -->
        {% if error %}
        <div class="alert alert-danger text-center py-2">{{ error }}</div>
        {% endif %}

        <!-- FORM -->
        <form action="{{ url_for('login_check') }}" method="POST">

            <input class="form-control mb-3" type="text" name="username" placeholder="Username" autofocus required>

            <input id="password" class="form-control mb-3" type="password" name="password" placeholder="Password" required>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="showPass" onclick="togglePassword()">
                <label class="form-check-label" for="showPass">Show password</label>
            </div>

            <button class="btn btn-brand w-100 py-2">Login</button>

        </form>

        <!-- SIGNUP LINK -->
        <p class="text-center mt-3 mb-0">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign up</a>
        </p>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword() {
    let p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}
</script>
{% endblock %}
